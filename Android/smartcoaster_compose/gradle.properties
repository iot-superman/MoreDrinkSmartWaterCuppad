# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a larger heap size helps avoid OutOfMemoryError during build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# More details, visit http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Enables the Gradle build cache to reuse build outputs.
org.gradle.caching=true

# AndroidX support
android.useAndroidX=true

# 專案所有相依套件都已使用 AndroidX，不再啟用已無必要的 Jetifier 轉換流程。
# 若日後加入仍使用舊 android.support.* 的第三方套件，才需要重新設為 true。
android.enableJetifier=false
